[pytest]
# 测试目录
testpaths = tests

# Python 文件匹配
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 输出选项
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# 标记定义
markers =
    unit: 单元测试
    integration: 集成测试
    e2e: 端到端测试
    slow: 慢速测试

# 日志
log_cli = false
log_cli_level = INFO

# 覆盖率选项（安装 pytest-cov 后生效）
# addopts = --cov=side_hustle_agent --cov-report=term-missing --cov-report=html

# 异步测试
asyncio_mode = auto